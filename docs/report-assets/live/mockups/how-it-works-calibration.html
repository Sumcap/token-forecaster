<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { width: 1046px; }
  .card { padding: 26px 32px 24px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
  .row .label { width: 250px; }
  .row .label b { color: var(--ink-strong); }
  .track {
    position: relative; flex: 1; height: 14px; border-radius: 7px;
    background: #e9ebe6;
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px;
    background: #a9c4f5;
  }
  .promise {
    position: absolute; top: -5px; bottom: -5px; width: 3px;
    background: #2b2e29; border-radius: 2px;
  }
  .row .got { width: 150px; text-align: right; }
  .row .got .v { font-weight: 700; color: var(--need); }
  .legend { display: flex; gap: 22px; margin-top: 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .legend .sw { display: inline-block; width: 18px; height: 9px; border-radius: 5px; background: #a9c4f5; margin-right: 6px; vertical-align: -1px; }
  .legend .tick { display: inline-block; width: 3px; height: 13px; border-radius: 2px; background: #2b2e29; margin-right: 6px; vertical-align: -2px; }
  .foot { margin-top: 4px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap card">
  <div class="row">
    <div class="label"><b>p50</b> <span class="dim">&middot; half the replies should fit</span></div>
    <div class="track"><div class="fill" style="width:59.5%"></div><div class="promise" style="left:50%"></div></div>
    <div class="got num"><span class="v">59.5%</span> <span class="dim">fitted</span></div>
  </div>
  <div class="row">
    <div class="label"><b>p90</b> <span class="dim">&middot; 9 replies in 10 should fit</span></div>
    <div class="track"><div class="fill" style="width:92.4%"></div><div class="promise" style="left:90%"></div></div>
    <div class="got num"><span class="v">92.4%</span> <span class="dim">fitted</span></div>
  </div>
  <div class="row">
    <div class="label"><b>p99</b> <span class="dim">&middot; 99 in 100 should fit</span></div>
    <div class="track"><div class="fill" style="width:99.1%"></div><div class="promise" style="left:99%"></div></div>
    <div class="got num"><span class="v">99.1%</span> <span class="dim">fitted</span></div>
  </div>
  <div class="legend">
    <span><span class="sw"></span>how often the real reply fitted</span>
    <span><span class="tick"></span>what the level promised</span>
  </div>
  <div class="foot">held-out calls the predictor never trained on, n = 3,076 &middot; bar at or past the mark = promise kept</div>
</div>
</body>
</html>
